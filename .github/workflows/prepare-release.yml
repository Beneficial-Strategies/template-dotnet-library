name: Prepare release

# Chooses the next version from the labels of the issues closed since the last release and writes the entry of
# CHANGELOG.md from them. It never tags or publishes: it pushes a release/vX.Y.Z branch for a person to review and merge.
# The version has three parts, design.breaking.compatible (see CONTRIBUTING.md).

on:
  workflow_dispatch:
    inputs:
      bump:
        description: auto reads the labels; choose another to override
        type: choice
        options: [auto, compatible, breaking, design]
        default: auto
      suffix:
        description: "Replace the pre-release suffix, for example -beta; empty keeps it"
        type: string
        default: ""
      dry_run:
        description: Show the version and the entry in the job summary and push nothing
        type: boolean
        default: true

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Test the release script
        run: python3 -m unittest -q test_prepare_release
        working-directory: tools/releasing

      - name: Choose the version and write the entry
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
          SUFFIX: ${{ inputs.suffix }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--bump "$BUMP")
          [ -n "$SUFFIX" ] && args+=(--suffix "$SUFFIX")
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          python3 tools/releasing/prepare_release.py "${args[@]}" | tee release-plan.txt
          { echo '```text'; cat release-plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Push the release branch
        if: ${{ !inputs.dry_run && steps.prepare.outputs.version != '' }}
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/v$VERSION"
          git add Directory.Build.props CHANGELOG.md
          git commit -m "Release $VERSION: version and changelog"
          git push origin "release/v$VERSION"
          {
            echo "### Release branch pushed"
            echo "[Open the pull request](https://github.com/${{ github.repository }}/compare/main...release/v$VERSION?expand=1&title=Release%20$VERSION)"
            echo
            echo "Edit the entry in the pull request if you want it in your own words, merge it, then tag \`v$VERSION\` on main to publish."
          } >> "$GITHUB_STEP_SUMMARY"
